server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        # Serwuj plik jeśli istnieje, w przeciwnym razie → Symfony front controller
        try_files $uri /index.php$is_args$args;
    }

    # Shim kompatybilności API: /api/index.php?p=...&pwd=...
    # Serwowany przez PHP-FPM (modyfikuje SCRIPT_NAME by Symfony poprawnie routował)
    location ~ ^/api/index\.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Front controller Symfony (index.php) obsługiwany przez PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Blokuj dostęp do pozostałych .php (bezpieczeństwo)
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
