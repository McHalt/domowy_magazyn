---
# Powrót do poprzedniego wydania:
#   ansible-playbook rollback.yaml
# Przestawia `current` na poprzednie wydanie i usuwa wycofane. Migracji nie cofa (są zgodne wstecz); w razie potrzeby
# zrzut bazy z backups/.
- name: Wycofanie domowego magazynu
  hosts: prod
  gather_facts: false
  vars_files:
    - vars/magazyn.yaml
  vars:
    ansible_user: "{{ app_user }}"
    ansistrano_deploy_to: "{{ deploy_to }}"
    ansistrano_allow_anonymous_stats: false
    ansistrano_rollback_after_symlink_tasks_file: "{{ playbook_dir }}/tasks/deploy/after-symlink.yaml"

  pre_tasks:
    - name: Przerwij w trybie --check
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Wycofanie nie ma trybu --check.
        quiet: true

  roles:
    - ansistrano.rollback

  post_tasks:
    - name: Pokaż bieżące wydanie
      ansible.builtin.debug:
        msg: "Bieżące wydanie: {{ ansistrano_rollback_release_version }}."
