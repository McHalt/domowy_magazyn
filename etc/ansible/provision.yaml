---
# Przygotowanie serwera: osobne konto aplikacji, pula PHP 8.3 FPM, timery, przejęcie konfiguracji z instalacji mchalt:
#   ansible-playbook provision.yaml --ask-become-pass --check --diff
#   ansible-playbook provision.yaml --ask-become-pass
# Inne strony (mod_php 8.1) i dotychczasowa pula magazynu zostają bez zmian, dopóki apache.yaml nie przełączy vhosta.
- name: Provision domowego magazynu
  hosts: prod
  become: true
  gather_facts: true
  force_handlers: true
  vars_files:
    - vars/magazyn.yaml

  tasks:
    - name: Sprawdź system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '22.04'
        fail_msg: "Playbook przygotowany dla Ubuntu 22.04, jest {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Sprawdź konfigurację z poprzedniej instalacji
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ legacy_shared_dir }}/.env.local"
        - "{{ legacy_shared_dir }}/.htpasswd"
        - "{{ shared_dir }}/.env.local"
      register: config_files

    - name: Przerwij bez konfiguracji do przejęcia
      ansible.builtin.fail:
        msg: "Brak {{ legacy_shared_dir }}/.env.local, z którego provision przejmuje sekrety i dane bazy, a nowej instalacji też nie ma."
      when: not config_files.results[0].stat.exists and not config_files.results[2].stat.exists

    # Konto i katalogi

    - name: Utwórz użytkownika {{ app_user }}
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        home: "/home/{{ app_user }}"
        create_home: true

    - name: Ogranicz katalog domowy
      ansible.builtin.file:
        path: "/home/{{ app_user }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"
      when: not ansible_check_mode

    # Konto nie ma hasła: logowanie wyłącznie tym kluczem.
    - name: Wgraj klucz SSH wdrożeń
      ansible.posix.authorized_key:
        user: "{{ app_user }}"
        key: "{{ app_user_ssh_public_key }}"
        exclusive: true
      when: not ansible_check_mode

    - name: Utwórz katalogi aplikacji
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ app_root }}", mode: "0750"}
        - {path: "{{ app_root }}/domains", mode: "0750"}
        - {path: "{{ deploy_to }}", mode: "0750"}
        - {path: "{{ deploy_to }}/releases", mode: "0750"}
        - {path: "{{ deploy_to }}/backups", mode: "0700"}
        - {path: "{{ deploy_to }}/tools", mode: "0750"}
        - {path: "{{ shared_dir }}", mode: "0750"}
        - {path: "{{ shared_dir }}/var", mode: "0750"}
        - {path: "{{ shared_dir }}/var/log", mode: "0750"}
        - {path: "{{ shared_dir }}/var/lock", mode: "0700"}
        - {path: "{{ secrets_dir }}", mode: "0700"}
      loop_control:
        label: "{{ item.path }}"
      when: not ansible_check_mode

    # Przejęcie konfiguracji: te same sekrety i ta sama baza, więc działająca strona (mchalt) niczego nie zauważa.

    - name: Przejmij .env.local
      ansible.builtin.command:
        argv: [install, -o, "{{ app_user }}", -g, "{{ app_user }}", -m, "0600", "{{ legacy_shared_dir }}/.env.local", "{{ shared_dir }}/.env.local"]
        creates: "{{ shared_dir }}/.env.local"
      when: not ansible_check_mode and config_files.results[0].stat.exists

    - name: Przejmij .htpasswd
      ansible.builtin.command:
        argv: [install, -o, "{{ app_user }}", -g, "{{ app_user }}", -m, "0640", "{{ legacy_shared_dir }}/.htpasswd", "{{ htpasswd_file }}"]
        creates: "{{ htpasswd_file }}"
      when: not ansible_check_mode and basic_auth_enabled | bool and config_files.results[1].stat.exists

    # Dane logowania do bazy z DATABASE_URL (wartości w apostrofach, % podwojone dla Symfony).
    - name: Zapisz dane logowania do bazy dla mysql i mysqldump
      ansible.builtin.shell:
        cmd: |
          set -eu
          umask 077
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit
          line = next(l for l in open(os.environ['ENV_FILE']) if l.startswith('DATABASE_URL='))
          url = urlsplit(line.split('=', 1)[1].strip().strip("'\"").replace('%%', '%'))
          password = unquote(url.password).replace('\\', '\\\\').replace('"', '\\"')
          with open(os.environ['CNF_FILE'] + '.tmp', 'w') as f:
              f.write('[client]\nuser=%s\npassword="%s"\nhost=%s\nport=%s\n' % (unquote(url.username), password, url.hostname, url.port or 3306))
          PY
          chown {{ app_user }}:{{ app_user }} "$CNF_FILE.tmp"
          mv "$CNF_FILE.tmp" "$CNF_FILE"
        executable: /bin/bash
        creates: "{{ secrets_dir }}/my.cnf"
      environment:
        ENV_FILE: "{{ shared_dir }}/.env.local"
        CNF_FILE: "{{ secrets_dir }}/my.cnf"
      when: not ansible_check_mode
      no_log: true

    # PHP 8.3

    # Klucz i Label PPA zmieniły się w 2024. Serwer kluczy odrzuca HEAD, którego get_url używa w trybie --check,
    # i za każdym razem zwraca nieco inną treść, więc pobieranie tylko gdy brak pliku.
    - name: Sprawdź plik klucza PPA ondrej/php
      ansible.builtin.stat:
        path: /etc/apt/trusted.gpg.d/ondrej-php-current.asc
      register: ondrej_key_file

    - name: Pobierz aktualny klucz PPA ondrej/php
      ansible.builtin.get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ ondrej_ppa_key_fingerprint }}"
        dest: /etc/apt/trusted.gpg.d/ondrej-php-current.asc
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode and not ondrej_key_file.stat.exists

    - name: Sprawdź odcisk klucza PPA
      ansible.builtin.command:
        cmd: gpg --show-keys --with-colons /etc/apt/trusted.gpg.d/ondrej-php-current.asc
      register: ondrej_key_info
      check_mode: false
      changed_when: false
      failed_when: "'fpr:::::::::' ~ ondrej_ppa_key_fingerprint ~ ':' not in ondrej_key_info.stdout"
      when: not ansible_check_mode

    - name: Sprawdź repozytorium ondrej/php
      ansible.builtin.command:
        argv: [grep, -rlsE, 'ppa\.launchpad(content)?\.net/ondrej/php', /etc/apt/sources.list, /etc/apt/sources.list.d]
      register: ondrej_repo
      check_mode: false
      changed_when: false
      failed_when: ondrej_repo.rc > 1

    - name: Dodaj repozytorium ondrej/php
      ansible.builtin.copy:
        dest: "/etc/apt/sources.list.d/ondrej-ubuntu-php-{{ ansible_facts['distribution_release'] }}.list"
        content: "deb https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ ansible_facts['distribution_release'] }} main\n"
        owner: root
        group: root
        mode: "0644"
      when: ondrej_repo.rc == 1

    - name: Odśwież listę pakietów  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: apt-get update -o Acquire::AllowReleaseInfoChange::Label=true -o DPkg::Lock::Timeout=600
      check_mode: false
      changed_when: false

    - name: Zainstaluj PHP {{ php_version }}
      ansible.builtin.apt:
        name:
          - "php{{ php_version }}-cli"
          - "php{{ php_version }}-fpm"
          - "php{{ php_version }}-curl"
          - "php{{ php_version }}-intl"
          - "php{{ php_version }}-mbstring"
          - "php{{ php_version }}-mysql"
          - "php{{ php_version }}-opcache"
          - "php{{ php_version }}-xml"
          - "php{{ php_version }}-zip"
          - unzip
        state: present
        lock_timeout: 600
      notify: Przeładuj PHP-FPM

    # Pakiet php8.3-cli przestawia alternatywę /usr/bin/php, a z niej korzystają pozostałe projekty.
    - name: Pozostaw /usr/bin/php przy PHP {{ php_default_version }}
      community.general.alternatives:
        name: php
        path: "/usr/bin/php{{ php_default_version }}"

    - name: Włącz moduły Apache potrzebne do FPM
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      loop: [proxy, proxy_fcgi, setenvif, rewrite]
      notify: Przeładuj Apache

    - name: Wgraj pulę FPM aplikacji
      ansible.builtin.template:
        src: templates/fpm-pool.conf.j2
        dest: "{{ fpm_pool_file }}"
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode
      notify: Przeładuj PHP-FPM

    - name: Sprawdź konfigurację PHP-FPM
      ansible.builtin.command:
        cmd: "php-fpm{{ php_version }} -t"
      changed_when: false
      when: not ansible_check_mode

    - name: Włącz PHP-FPM {{ php_version }}
      ansible.builtin.systemd_service:
        name: "{{ fpm_service }}"
        enabled: true
        state: started
      when: not ansible_check_mode

    # Composer z apt (2.2.6) jest za stary na PHP 8.3.
    - name: Pobierz Composera
      ansible.builtin.get_url:
        url: https://getcomposer.org/download/latest-2.x/composer.phar
        checksum: "sha256:https://getcomposer.org/download/latest-2.x/composer.phar.sha256"
        dest: "{{ composer_phar }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"
      when: not ansible_check_mode

    # Zadania cykliczne: timery systemd uruchamiają polecenia z bieżącego wydania, więc deploy ich nie restartuje.

    - name: Wgraj usługi zadań cyklicznych
      ansible.builtin.template:
        src: templates/timer-job.service.j2
        dest: "/etc/systemd/system/{{ timer_prefix }}-{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ timer_jobs }}"
      loop_control:
        label: "{{ item.name }}"
      register: job_services

    - name: Wgraj timery zadań cyklicznych
      ansible.builtin.template:
        src: templates/timer-job.timer.j2
        dest: "/etc/systemd/system/{{ timer_prefix }}-{{ item.name }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ timer_jobs }}"
      loop_control:
        label: "{{ item.name }}"
      register: job_timers

    - name: Przeładuj systemd po zmianie jednostek
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: not ansible_check_mode and (job_services is changed or job_timers is changed)

    - name: Włącz timery
      ansible.builtin.systemd_service:
        name: "{{ timer_prefix }}-{{ item.name }}.timer"
        enabled: "{{ timers_enabled | bool }}"
        state: "{{ 'started' if timers_enabled | bool else 'stopped' }}"
      loop: "{{ timer_jobs }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode

    - name: Pozwól wdrożeniu przeładować PHP-FPM
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ app_user }}"
        content: |
          {{ app_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl reload {{ fpm_service }}
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Wgraj rotację logów
      ansible.builtin.template:
        src: templates/logrotate.j2
        dest: /etc/logrotate.d/domowy-magazyn
        owner: root
        group: root
        mode: "0644"

    # Nadrabia przeładowanie z przerwanego wcześniej przebiegu.
    - name: Sprawdź, czy pula aplikacji działa
      ansible.builtin.stat:
        path: "{{ fpm_socket }}"
      register: fpm_socket_before
      changed_when: not fpm_socket_before.stat.exists
      notify: Przeładuj PHP-FPM

    - name: Wykonaj zaległe przeładowania
      ansible.builtin.meta: flush_handlers

    # Sprawdzenie

    - name: Sprawdź stan po zmianach
      when: not ansible_check_mode
      block:
        - name: Sprawdź grupy {{ app_user }}
          ansible.builtin.command:
            cmd: "id -Gn {{ app_user }}"
          register: app_groups
          changed_when: false
          failed_when: app_groups.stdout.split() != [app_user]

        - name: Sprawdź domyślne PHP
          ansible.builtin.command:
            cmd: php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;'
          register: default_php
          changed_when: false
          failed_when: default_php.stdout != php_default_version

        - name: Sprawdź rozszerzenia PHP {{ php_version }}
          ansible.builtin.command:
            cmd: "{{ php_bin }} -m"
          vars:
            required_extensions: [ctype, curl, dom, iconv, intl, mbstring, openssl, pdo_mysql, sodium, zip]
          register: php_modules
          changed_when: false
          failed_when: required_extensions | difference(php_modules.stdout_lines) | length > 0

        - name: Sprawdź gniazdo puli FPM
          ansible.builtin.stat:
            path: "{{ fpm_socket }}"
          register: fpm_socket_stat
          until: fpm_socket_stat.stat.exists
          retries: 5
          delay: 1
          failed_when: >-
            not fpm_socket_stat.stat.exists or fpm_socket_stat.stat.pw_name != app_user
            or fpm_socket_stat.stat.gr_name != app_user or fpm_socket_stat.stat.mode != '0660'

        - name: Sprawdź połączenie z bazą jako {{ app_user }}
          ansible.builtin.command:
            cmd: "mysql --defaults-extra-file={{ secrets_dir }}/my.cnf -NBe 'SELECT CURRENT_USER()' {{ db_name }}"
          become: true
          become_user: "{{ app_user }}"
          register: db_login
          changed_when: false
          failed_when: not db_login.stdout.startswith(db_user ~ '@')

        - name: Sprawdź prawa do katalogu aplikacji
          ansible.builtin.stat:
            path: "{{ app_root }}"
          register: app_root_stat
          failed_when: app_root_stat.stat.mode != '0750' or app_root_stat.stat.pw_name != app_user

        - name: Sprawdź prawa do plików z sekretami
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: ["{{ shared_dir }}/.env.local", "{{ secrets_dir }}/my.cnf"]
          register: secret_files
          failed_when: secret_files.stat.mode != '0600' or secret_files.stat.pw_name != app_user

        - name: Sprawdź timery  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "systemctl is-enabled {{ timer_prefix }}-{{ item.name }}.timer"
          loop: "{{ timer_jobs }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false
          when: timers_enabled | bool

  handlers:
    - name: Przeładuj PHP-FPM
      ansible.builtin.systemd_service:
        name: "{{ fpm_service }}"
        state: reloaded
      when: not ansible_check_mode

    - name: Przeładuj Apache
      ansible.builtin.systemd_service:
        name: apache2
        state: reloaded
      when: not ansible_check_mode

- name: Logowanie jako konto aplikacji
  hosts: prod
  gather_facts: false
  vars_files:
    - vars/magazyn.yaml
  # Zmienna play wygrywa z ansible_user z inwentarza (remote_user by nie wygrał).
  vars:
    ansible_user: "{{ app_user }}"

  tasks:
    - name: Sprawdź logowanie kluczem
      ansible.builtin.command:
        cmd: id -un
      register: whoami
      changed_when: false
      failed_when: whoami.stdout != app_user
      when: not ansible_check_mode

    - name: Sprawdź przeładowanie PHP-FPM bez hasła
      ansible.builtin.command:
        cmd: "sudo -n /usr/bin/systemctl reload {{ fpm_service }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Sprawdź brak innych uprawnień sudo
      ansible.builtin.command:
        cmd: sudo -n true
      register: sudo_other
      changed_when: false
      failed_when: sudo_other.rc == 0
      when: not ansible_check_mode
