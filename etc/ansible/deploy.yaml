---
# Wdrożenie:
#   ansible-playbook deploy.yaml [-e commit=<sha|gałąź|tag>]
# Wdrażany jest zatwierdzony commit (domyślnie HEAD), nie kopia robocza. Połączenie jako konto aplikacji, bez hasła
# sudo. `current` przeskakuje dopiero po composerze, sprawdzeniu bazy i migracjach; błąd wcześniej usuwa nowe wydanie
# i nie dotyka działającego.
- name: Wdrożenie domowego magazynu
  hosts: prod
  gather_facts: false
  vars_files:
    - vars/magazyn.yaml
  vars:
    ansible_user: "{{ app_user }}"
    commit: HEAD
    magazyn_archive: "/tmp/domowy-magazyn-{{ magazyn_commit }}.tar.gz"

    ansistrano_deploy_to: "{{ deploy_to }}"
    ansistrano_deploy_via: copy_unarchive
    ansistrano_deploy_from: "{{ magazyn_archive }}"
    ansistrano_keep_releases: "{{ releases_keep }}"
    ansistrano_allow_anonymous_stats: false
    ansistrano_shared_paths:
      - var/log
      - var/share
    ansistrano_shared_files:
      - .env.local
      - .env.prod.local
    ansistrano_after_setup_tasks_file: "{{ playbook_dir }}/tasks/deploy/after-setup.yaml"
    ansistrano_after_update_code_tasks_file: "{{ playbook_dir }}/tasks/deploy/after-update-code.yaml"
    ansistrano_after_symlink_shared_tasks_file: "{{ playbook_dir }}/tasks/deploy/after-symlink-shared.yaml"
    ansistrano_after_symlink_tasks_file: "{{ playbook_dir }}/tasks/deploy/after-symlink.yaml"

  pre_tasks:
    - name: Przerwij w trybie --check
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Wdrożenie nie ma trybu --check; nieudany przebieg i tak nie dotyka działającego wydania.
        quiet: true

    - name: Ustal wdrażany commit
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", rev-parse, --short=12, --verify, "{{ commit }}^{commit}"]
      register: commit_sha
      delegate_to: localhost
      changed_when: false

    - name: Nazwij wydanie
      ansible.builtin.set_fact:
        magazyn_commit: "{{ commit_sha.stdout }}"
        ansistrano_release_version: "{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}-{{ commit_sha.stdout }}"

    # Bez composer.lock każde wdrożenie instalowałoby inne wersje paczek niż sprawdzone lokalnie.
    - name: Sprawdź composer.lock w commicie
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", cat-file, -e, "{{ magazyn_commit }}:composer.lock"]
      delegate_to: localhost
      changed_when: false

    - name: Spakuj aplikację z commita
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", archive, --format=tar.gz, "--output={{ magazyn_archive }}", "{{ magazyn_commit }}"]
      delegate_to: localhost
      changed_when: false

    - name: Sprawdź plik sekretów zewnętrznych
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.secrets/extra.yml"
      register: local_secrets
      delegate_to: localhost

    - name: Wczytaj sekrety zewnętrzne
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/.secrets/extra.yml"
      when: local_secrets.stat.exists
      no_log: true

    # Wartości trafiają do .env.prod.local w apostrofach.
    - name: Sprawdź wartości konfiguracji
      ansible.builtin.assert:
        that:
          - "\"'\" not in item.value | string"
          - "'\n' not in item.value | string"
        fail_msg: "{{ item.key }}: wartość zawiera apostrof lub nową linię."
        quiet: true
      loop: "{{ {'hub_issuer': hub_issuer, 'hub_internal_url': hub_internal_url, 'hub_client_id': hub_client_id,
             'hub_client_secret': hub_client_secret, 'hub_event_key': hub_event_key} | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Przypomnij o sekretach huba
      ansible.builtin.debug:
        msg: hub_client_secret lub hub_event_key jest pusty (.secrets/extra.yml); logowanie przez hub i zdarzenia nie zadziałają.
      when: hub_client_secret | length == 0 or hub_event_key | length == 0

  roles:
    - ansistrano.deploy

  post_tasks:
    - name: Usuń archiwum
      ansible.builtin.file:
        path: "{{ magazyn_archive }}"
        state: absent
      delegate_to: localhost

    - name: Pokaż wdrożone wydanie
      ansible.builtin.debug:
        msg: "Wdrożony commit {{ magazyn_commit }}, wydanie {{ ansistrano_release_version }}."
